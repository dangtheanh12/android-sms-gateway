name: PR Build

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: pr-build-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "⚠️ GOOGLE_SERVICES_JSON secret not set. Creating dummy file."
            echo '{}' > app/google-services.json
          else
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.event.pull_request.head.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Comment PR with artifact link
        uses: actions/github-script@v7
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          script: |
            const sha = context.payload.pull_request.head.sha
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = `## PR Build Artifacts

            | File | Commit |
            |------|--------|
            | [Debug APK](${runUrl}) | \`${sha}\` |

            _Artifact available in Actions tab, retention 14 days._`

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
