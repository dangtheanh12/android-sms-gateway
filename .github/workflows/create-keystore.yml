name: Create Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias smsgateway \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass SMSGate2026! \
            -keypass SMSGate2026! \
            -dname "CN=SMSGate, OU=Dev, O=SMSGate, L=Hanoi, ST=Hanoi, C=VN"

      - name: Convert to Base64
        run: |
          base64 -w 0 release.keystore > keystore-base64.txt
          echo "===== KEYSTORE BASE64 ====="
          cat keystore-base64.txt
          echo ""
          echo "===== END ====="

      - name: Upload Keystore Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            release.keystore
            keystore-base64.txt
          retention-days: 7
